<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias</title>
</head>
<body>
    <h1>Imagem dinámica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente ou diminuo o tamanho do seu navegador</p>
    
    <picture>
        <source media="(max-width:700px )" srcset="img/P.png" type="image/png">
        <source media="(max-width:1050px )" srcset="img/M.png" type="image/png">
        <img src="img/G.png" alt="imagem flexivel">
        
    </picture>
</body>
</html>
